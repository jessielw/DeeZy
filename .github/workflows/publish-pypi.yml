name: PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. 'v1.3.0' or 'refs/tags/v1.3.0'). If provided, takes precedence over 'branch'."
        required: false
        default: ""
      branch:
        description: "Branch to build and publish (e.g. 'main' or 'dev'). Used when 'tag' is not provided. Defaults to 'main'."
        required: false
        default: "main"

jobs:
  publish_to_pypi:
    # Skip CI test tags such as 2.0.0-testing-ci1.
    if: >-
      (github.ref_type != 'tag' || !contains(github.ref_name, '-test')) &&
      !contains(inputs.tag, '-test') &&
      (github.event_name != 'release' || !contains(github.ref_name, 'rc'))
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/deezy/

    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.sha || inputs.tag || inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade uv
          uv venv .venv
          . .venv/bin/activate && uv pip install --upgrade build twine

      - name: Build package
        run: . .venv/bin/activate && uv build

      - name: Smoke test built wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one DeeZy wheel in dist/." >&2
            exit 1
          fi
          wheel="$PWD/${wheels[0]}"
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          unset PYTHONPATH
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python "$wheel"
          .venv/bin/deezy --version
          .venv/bin/deezy bitrates ddp

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
