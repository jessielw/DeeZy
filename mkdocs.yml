site_name: DeeZy Documentation
site_description: Portable audio encoding built around the Dolby Encoding Engine
use_directory_urls: false

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Migrating from 1.x: migration.md
      - dee_shim: dee-shim.md
      - Configuration: configuration.md
      - Usage: usage.md
      - Examples & Workflows: examples.md
  - CLI Reference:
      - Overview: cli/top-level.md
      - Encode:
          - Overview: cli/encode.md
          - Dolby Digital (dd): cli/encode-dd.md
          - Dolby Digital Plus (ddp): cli/encode-ddp.md
          - DD+ Blu-ray (ddp-bluray): cli/encode-ddp-bluray.md
          - DD+ Atmos (ddp-atmos): cli/encode-ddp-atmos.md
          - AC-4 (ac4): cli/encode-ac4.md
          - AC-4 immersive stereo (ac4-ims): cli/encode-ac4-ims.md
          - AC-4 Atmos (ac4-atmos): cli/encode-ac4-atmos.md
          - AAC (aac): cli/encode-aac.md
          - TrueHD (thd): cli/encode-thd.md
          - TrueHD Atmos (thd-atmos): cli/encode-thd-atmos.md
          - Preset (preset): cli/encode-preset.md
      - Find: cli/find.md
      - Info: cli/info.md
      - Measure: cli/measure.md
      - Bitrates: cli/bitrates.md
      - Tools: cli/tools.md
      - Config: cli/config.md
      - Temp: cli/temp.md
  - Formats:
      - Dolby Digital (dd): formats/dd.md
      - Dolby Digital Plus (ddp): formats/ddp.md
      - DD+ Blu-ray (ddp-bluray): formats/ddp-bluray.md
      - DD+ Atmos (ddp-atmos): formats/ddp-atmos.md
      - AC-4 (ac4): formats/ac4.md
      - AC-4 immersive stereo (ac4-ims): formats/ac4-ims.md
      - AC-4 Atmos (ac4-atmos): formats/ac4-atmos.md
      - AAC (aac): formats/aac.md
      - TrueHD (thd): formats/thd.md
      - TrueHD Atmos (thd-atmos): formats/thd-atmos.md
  - Advanced:
      - Delay: delay.md
      - Track Selection: track-selection.md
      - Templates: templates.md
      - Temp Management: temp.md
      - Batch & Retention: batch.md
      - Presets: presets.md
      - Bitrates: bitrate-guidelines.md
      - DRC: drc.md
      - File Management & Analysis: file-management.md
      - Input Patterns: input-types.md
  - Tips & Best Practices: tips.md
  - Reference: reference.md
  - Troubleshooting: troubleshooting.md

theme:
  name: material
  favicon: images/icon.ico
  logo: images/icon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch color mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Montserrat
    code: Fira Mono
  features:
    - content.code.copy
    - search.highlight
    - navigation.footer

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: !relative $config_dir
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
  - offline

extra_css:
  - stylesheets/extra.css
