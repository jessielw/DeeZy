[project]
name = "deezy"
version = "1.3.15-dev.1"
description = "Dolby Encoding Engine Wrapper"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pymediainfo",
    "tomlkit",
    "platformdirs>=4.11.7",
    "typing-extensions>=4.16.0",
    "rich>=14.3.4",
    "oslex2>=1.0.0",
    "guessit>=4.4.0",
    "unidecode>=1.4.0",
]
authors = [{ name = "jessielw" }]
license = { file = "LICENSE" }
keywords = ["audio", "dolby", "encoding", "dee", "ddp", "atmos", "ac4"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = { "Source" = "https://github.com/jessielw/deezy", "Tracker" = "https://github.com/jessielw/DeeZy/issues" }

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
build = ["pyinstaller>=6.13.0", "pyinstaller-hooks-contrib>=2025.1"]
dev = ["ruff", "basedpyright", "poethepoet>=0.48.0"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.11",
    "pymdown-extensions>=10.16.1",
]

[project.scripts]
deezy = "deezy.__main__:main"

[tool.setuptools.package-data]
"deezy" = ["config/*.py", "config/*.toml", "icon/*", "example_json_flows/*"]

[tool.ruff]
line-length = 88
include = ["deezy.py", "version.py", "cli/*.py", "deezy/**/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions and fixed fixture paths are normal test constructs.
"tests/**/*.py" = ["S101", "S108"]
# These modules are process wrappers; arguments are passed as lists with shell=False.
"deezy/audio_processors/dee.py" = ["S603"]
"deezy/audio_processors/ffmpeg.py" = ["S603"]
"deezy/audio_processors/truehdd.py" = ["S603"]
# This developer-only release utility deliberately invokes uv and git from PATH.
"version.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.basedpyright]
include = ["deezy"]
typeCheckingMode = "standard"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deezy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
typecheck = "basedpyright"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format-check = "ruff format . --check"
format-code = "ruff format ."
format.sequence = ["lint-fix", "format-code"]
sync-dev = "scripts/sync_dev.py"
